name: Release

# Publishes a GitHub Release whenever master carries a package.json version that has no vX.Y.Z tag yet
# (so pushing from GitHub Desktop, which doesn't push tags, still releases), or when a version tag is pushed.
on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        shell: bash
        run: |
          ver=$(node -p "require('./package.json').version")
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          elif git ls-remote --exit-code --tags origin "refs/tags/v$ver" > /dev/null; then
            echo "v$ver is already released; nothing to do."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  windows:
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build postadmin.exe
        run: npm run build:exe

      - name: Build launcher
        run: npm run build:launcher

      # Code signing via SignPath (see CODE_SIGNING.md). Skipped until the SIGNPATH_ORGANIZATION_ID
      # repository variable is set. Each signing request waits for manual approval in SignPath.
      - name: Upload unsigned launcher
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        id: upload-launcher
        uses: actions/upload-artifact@v7
        with:
          name: launcher-unsigned
          path: dist/PostAdmin-Launcher.exe

      - name: Sign launcher
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: launcher
          github-artifact-id: ${{ steps.upload-launcher.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: dist

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        run: npm run build:installer

      - name: Upload unsigned installer
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        id: upload-installer
        uses: actions/upload-artifact@v7
        with:
          name: installer-unsigned
          path: dist/PostAdmin-Setup-*.exe

      - name: Sign installer
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.upload-installer.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: dist

      - name: Collect release notes from CHANGELOG.md
        shell: bash
        run: |
          awk -v v="$VERSION" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "PostAdmin v$VERSION" > notes.md

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: PostAdmin v${{ env.VERSION }}
          body_path: notes.md
          files: |
            dist/PostAdmin-Setup-*.exe
            dist/postadmin.exe
