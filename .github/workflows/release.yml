name: Release

# Runs when a version tag is pushed (npm run release:patch|minor|major pushes one).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build postadmin.exe
        run: npm run build:exe

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        run: npm run build:installer

      - name: Collect release notes from CHANGELOG.md
        shell: bash
        run: |
          ver="${GITHUB_REF_NAME#v}"
          awk -v v="$ver" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "PostAdmin $GITHUB_REF_NAME" > notes.md

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: PostAdmin ${{ github.ref_name }}
          body_path: notes.md
          files: |
            dist/PostAdmin-Setup-*.exe
            dist/postadmin.exe

      - name: Upload build (manual runs)
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: actions/upload-artifact@v4
        with:
          name: postadmin-windows
          path: |
            dist/PostAdmin-Setup-*.exe
            dist/postadmin.exe
