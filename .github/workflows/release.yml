name: Release

# Publishes a GitHub Release whenever master carries a package.json version that has no vX.Y.Z tag yet
# (so pushing from GitHub Desktop, which doesn't push tags, still releases), or when a version tag is pushed.
on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        shell: bash
        run: |
          ver=$(node -p "require('./package.json').version")
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          elif git ls-remote --exit-code --tags origin "refs/tags/v$ver" > /dev/null; then
            echo "v$ver is already released; nothing to do."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  windows:
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build postadmin.exe
        run: npm run build:exe

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        run: npm run build:installer

      - name: Collect release notes from CHANGELOG.md
        shell: bash
        run: |
          awk -v v="$VERSION" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "PostAdmin v$VERSION" > notes.md

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: PostAdmin v${{ env.VERSION }}
          body_path: notes.md
          files: |
            dist/PostAdmin-Setup-*.exe
            dist/postadmin.exe
